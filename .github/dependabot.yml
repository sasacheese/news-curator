version: 2

# Actions は commit SHA で固定しているので、手で追うのは現実的ではない。
# メジャー更新は「動いているものに手を入れない」方針だが、ignore で塞ぐと
# セキュリティ修正まで止まるため、まとめずに個別 PR で出させて中身を見て判断する。
updates:
  - package-ecosystem: npm
    # npm workspaces はルートの package-lock.json で一括管理されている
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # パッチ・マイナーは個別に見る価値がないので 1 本にまとめる
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
