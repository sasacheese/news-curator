name: Daily digest

on:
  schedule:
    # 22:00 UTC = 07:00 JST。GitHub Actions の cron は数分〜十数分遅延することがあります。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 (YYYY-MM-DD)。省略すると当日ぶん。'
        required: false
        type: string
      skip_collect:
        description: '収集をスキップして、既存データの再デプロイだけ行う'
        required: false
        type: boolean
        default: false

# 権限はジョブ単位で与える。collect にデプロイ権限は要らず、
# deploy にリポジトリへの書き込み権限は要らない。
permissions: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  collect:
    name: 収集・要約
    # ubuntu-slim は 15 分でジョブがタイムアウトするため、
    # 40 弱のソースを巡回して LLM を呼ぶこのジョブでは使えない。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # data/ にダイジェストを push するため
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ダイジェストを生成
        if: ${{ !inputs.skip_collect }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # RANK_MODEL / SUMMARY_MODEL に gpt-* を指定したときに使う。
          # 未登録なら空文字になり、OpenAI バックエンドは初期化されない。
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          # 未登録なら読者フィードバックは反映されず、今までと同じ動作になる。
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          RANK_MODEL: ${{ vars.RANK_MODEL }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          SUMMARY_EFFORT: ${{ vars.SUMMARY_EFFORT }}
          TOP_N: ${{ vars.TOP_N }}
          OTHER_N: ${{ vars.OTHER_N }}
          LANE_CANDIDATES: ${{ vars.LANE_CANDIDATES }}
          # レーンの振り分けしきい値。実行ログの「振り分け」の行を見ながら動かす前提の値なので、
          # ワークフローを編集せずリポジトリ変数から変えられるようにしておく。
          KNOW_THRESHOLD: ${{ vars.KNOW_THRESHOLD }}
          TALK_THRESHOLD: ${{ vars.TALK_THRESHOLD }}
          # 掲載のスコア下限。該当が乏しいレーンで低評価の記事が深掘りへ回るのを防ぐ。
          MIN_TOP_SCORE: ${{ vars.MIN_TOP_SCORE }}
          MIN_OTHER_SCORE: ${{ vars.MIN_OTHER_SCORE }}
          # 式を直接 run に埋め込まず環境変数経由で渡す（シェルへの注入を避けるため）
          DIGEST_DATE: ${{ inputs.date }}
        run: |
          if [ -n "${DIGEST_DATE:-}" ]; then
            npm run collect -- --date="$DIGEST_DATE"
          else
            npm run collect
          fi

      - name: 結果をコミット
        if: ${{ !inputs.skip_collect }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore(digest): $(TZ=Asia/Tokyo date '+%Y-%m-%d') のダイジェストを追加"
            git push
          fi

  deploy:
    name: GitHub Pages へデプロイ
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages へのデプロイと OIDC トークンの取得。リポジトリは読むだけ。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # collect ジョブが push した最新のデータを取り込む
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: ビルド
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # PUBLIC の名の通り秘密情報ではない（アクセス制御は Firestore の
          # Security Rules 側で行う）ので Secrets ではなく Variables に登録する。
          # 未登録ならフィードバック機能は表示されない。
          VITE_FIREBASE_PUBLIC_API_KEY: ${{ vars.VITE_FIREBASE_PUBLIC_API_KEY }}
          VITE_FIREBASE_PUBLIC_PROJECT_ID: ${{ vars.VITE_FIREBASE_PUBLIC_PROJECT_ID }}
          VITE_FIREBASE_PUBLIC_APP_ID: ${{ vars.VITE_FIREBASE_PUBLIC_APP_ID }}
          VITE_FEEDBACK_TOKEN: ${{ secrets.VITE_FEEDBACK_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
