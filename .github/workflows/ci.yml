name: CI

# 型チェックがどこでも走っていなかったので追加した。
# vite build も tsx も型を検査せずに落とすだけなので、
# これが無いと型エラーは本番デプロイまで通り抜けてしまう。
on:
  pull_request:
  push:
    branches: [main]

# 読むだけ。デプロイ権限は digest.yml 側にしか持たせない。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型チェック・テスト・ビルド
    # digest.yml と違ってこのジョブは数分で終わるので、1 vCPU・15 分制限の
    # ubuntu-slim で足りる。node は setup-node で入れる。docker は使わない。
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
