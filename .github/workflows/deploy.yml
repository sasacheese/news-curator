name: Deploy site

# サイトのビルドと Pages へのデプロイ。単独では起動せず、呼ばれたときだけ動く。
#
# 朝のダイジェスト（digest.yml）が data/ にコミットしたあとで呼ぶ。手順をここに
# 分けてあるのは、別のワークフローからも同じ手順でデプロイできるようにするため。
# 呼び出し側ごとに書くと、片方だけ環境変数を足し忘れて「トレンドだけ出ない」
# ような壊れ方をする。
on:
  workflow_call:
    inputs:
      send_push:
        description: 'デプロイ後に朝のダイジェストのプッシュ通知を送る'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    name: GitHub Pages へデプロイ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages へのデプロイと OIDC トークンの取得。リポジトリは読むだけ。
    #
    # ⚠️ 呼び出し側のジョブでも同じ permissions を宣言する必要がある。
    # 再利用ワークフローのトークンは呼び出し側の権限を上限にするので、
    # 呼び出し側が `permissions: {}` のままだとここの宣言は効かない。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 呼び出し元のジョブが push した最新のデータを取り込む
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: ビルド
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # PUBLIC の名の通り秘密情報ではない（アクセス制御は Firestore の
          # Security Rules 側で行う）ので Secrets ではなく Variables に登録する。
          # 未登録ならフィードバック機能は表示されない。
          VITE_FIREBASE_PUBLIC_API_KEY: ${{ vars.VITE_FIREBASE_PUBLIC_API_KEY }}
          VITE_FIREBASE_PUBLIC_PROJECT_ID: ${{ vars.VITE_FIREBASE_PUBLIC_PROJECT_ID }}
          VITE_FIREBASE_PUBLIC_APP_ID: ${{ vars.VITE_FIREBASE_PUBLIC_APP_ID }}
          VITE_FEEDBACK_TOKEN: ${{ secrets.VITE_FEEDBACK_TOKEN }}
          # VAPID の公開鍵。未登録なら設定画面にプッシュ通知の項目が出ない。
          # 秘密鍵（VAPID_PRIVATE_KEY）とペアで、公開側だけをビルドに埋め込む。
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # デプロイの「後」に送る。先に送ると、通知をタップした先がまだ前日のままになる。
      # VAPID 鍵か Firebase が未登録ならスクリプト側が黙ってスキップする。
      # 再デプロイ（skip_collect）の朝に同じ通知を二度出さないよう、そちらでも送らない。
      - name: プッシュ通知を送信
        if: ${{ inputs.send_push }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # 未登録ならサイト URL を subject に使う（連絡先の表明として仕様を満たす）
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: npm run push:send
